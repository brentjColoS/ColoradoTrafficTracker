version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/operations/visitor-analytics"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 1
    groups:
      monthly-visitor-maintenance:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    groups:
      monthly-maven-maintenance:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 3
    groups:
      monthly-actions-maintenance:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
