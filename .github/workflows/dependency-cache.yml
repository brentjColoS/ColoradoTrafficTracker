name: Refresh experimental dependencies

on:
  push:
    branches: [experiment/dashboard-reconstruction]
    paths:
      - pom.xml
      - '**/pom.xml'
      - .mvn/**
      - mvnw
      - '**/Dockerfile'
      - .dockerignore
      - .github/workflows/dependency-cache.yml
      - scripts/ci/verify_dependency_cache.py
      - scripts/ci/test_cache_restore.py
      - .github/actions/maven-cache/**
      - scripts/ci/prepare-maven-cache.sh
      - scripts/ci/test_dependency_cache.py
  pull_request:
    branches: [experiment/dashboard-reconstruction]
    paths:
      - pom.xml
      - '**/pom.xml'
      - .mvn/**
      - mvnw
      - '**/Dockerfile'
      - .dockerignore
      - .github/workflows/ci.yml
      - .github/workflows/dependency-cache.yml
      - scripts/ci/verify_dependency_cache.py
      - scripts/ci/test_cache_restore.py
      - .github/actions/maven-cache/**
      - scripts/ci/prepare-maven-cache.sh
      - scripts/ci/test_dependency_cache.py

permissions:
  contents: read

concurrency:
  group: dependency-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maven-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout accepted integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21 and shared dependency cache
        uses: ./.github/actions/maven-cache

      - name: Resolve dependencies and mutation tooling without running the application
        run: bash scripts/ci/prepare-maven-cache.sh -U

  verify-maven-restore:
    needs: maven-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout on a fresh runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Change Docker workflow text without changing Maven inputs
        run: printf '\n# Maven cache isolation probe\n' >> .github/workflows/dependency-cache.yml

      - name: Restore exact dependencies without saving a replacement
        id: maven
        uses: ./.github/actions/maven-cache
        with:
          read-only: 'true'

      - name: Require an exact cache hit
        env:
          CACHE_HIT: ${{ steps.maven.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true

      - name: Resolve dependencies with network resolution disabled
        run: bash scripts/ci/prepare-maven-cache.sh --offline

  container-dependencies:
    if: github.ref == 'refs/heads/experiment/dashboard-reconstruction' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout accepted integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure public registry cache
        shell: bash
        run: |
          candidate=$(mktemp)
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json | jq -e -f scripts/ci/docker-registry-cache.jq > "$candidate"
          else
            printf '{}\n' | jq -e -f scripts/ci/docker-registry-cache.jq > "$candidate"
          fi
          sudo install -d /etc/docker
          sudo install -m 0600 "$candidate" /etc/docker/daemon.json
          rm "$candidate"
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Refresh routes dependency layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: routes-service/Dockerfile
          target: dependencies
          push: false
          cache-from: type=gha,scope=routes-service-dependencies-v1,timeout=2m
          cache-to: type=gha,mode=max,scope=routes-service-dependencies-v1,timeout=2m,ignore-error=true

      - name: Refresh ingest dependency layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ingest-service/Dockerfile
          target: dependencies
          push: false
          cache-from: type=gha,scope=ingest-service-dependencies-v1,timeout=2m
          cache-to: type=gha,mode=max,scope=ingest-service-dependencies-v1,timeout=2m,ignore-error=true

      - name: Refresh API dependency layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api-service/Dockerfile
          target: dependencies
          push: false
          cache-from: type=gha,scope=api-service-dependencies-v1,timeout=2m
          cache-to: type=gha,mode=max,scope=api-service-dependencies-v1,timeout=2m,ignore-error=true

  verify-cache-restore:
    needs: container-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout on a fresh runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Change application source without changing dependency inputs
        run: |
          mkdir -p common/src/main/resources
          touch common/src/main/resources/cache-reuse-probe

      - name: Configure public registry cache
        run: |
          candidate=$(mktemp)
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json | jq -e -f scripts/ci/docker-registry-cache.jq > "$candidate"
          else
            printf '{}\n' | jq -e -f scripts/ci/docker-registry-cache.jq > "$candidate"
          fi
          sudo install -d /etc/docker
          sudo install -m 0600 "$candidate" /etc/docker/daemon.json
          rm "$candidate"
          sudo systemctl restart docker

      - name: Set up a clean Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Restore routes dependencies without exporting a replacement
        id: routes
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: routes-service/Dockerfile
          target: dependencies
          push: false
          cache-from: type=gha,scope=routes-service-dependencies-v1,timeout=2m

      - name: Restore ingest dependencies without exporting a replacement
        id: ingest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ingest-service/Dockerfile
          target: dependencies
          push: false
          cache-from: type=gha,scope=ingest-service-dependencies-v1,timeout=2m

      - name: Restore API dependencies without exporting a replacement
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api-service/Dockerfile
          target: dependencies
          push: false
          cache-from: type=gha,scope=api-service-dependencies-v1,timeout=2m

      - name: Require all dependency RUN steps to be cached
        env:
          ROUTES_METADATA: ${{ steps.routes.outputs.metadata }}
          INGEST_METADATA: ${{ steps.ingest.outputs.metadata }}
          API_METADATA: ${{ steps.api.outputs.metadata }}
        run: python3 -B scripts/ci/verify_dependency_cache.py
