name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Determine mutation scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -B scripts/ci/mutation_scope.py >> "$GITHUB_OUTPUT"

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Verify with Maven
        run: ./mvnw -B -ntp clean verify

      - name: Record verified API bytecode
        run: python3 -B scripts/ci/api_mutation.py record-bytecode

      - name: Upload verified API bytecode
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-api-bytecode
          include-hidden-files: true
          path: |
            api-service/target/classes/
            api-service/target/test-classes/
            api-service/target/verified-api.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-coverage-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

  resilience-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: Lint GitHub Actions workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

      - name: Verify mutation tooling
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Verify resilience tooling
        run: ./scripts/verify-resilience.sh

      - name: Verify dashboard data behavior
        run: node --test scripts/tests/dashboard.test.cjs

  mutation-tests:
    name: mutation-tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-and-test, mutation-scope]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: routes-service
            module: routes-service
            profile: mutation
            shard: none
          - name: ingest-service
            module: ingest-service
            profile: mutation
            shard: none
          - name: api-web
            module: api-service
            profile: mutation,mutation-api-web
            shard: web
          - name: api-support
            module: api-service
            profile: mutation,mutation-api-support
            shard: support

    steps:
      - name: Checkout
        if: needs.mutation-scope.outputs.required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        if: needs.mutation-scope.outputs.required == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Download verified API bytecode
        if: needs.mutation-scope.outputs.required == 'true' && matrix.shard != 'none'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-api-bytecode
          path: api-service/target

      - name: Run mutation testing
        if: needs.mutation-scope.outputs.required == 'true'
        env:
          MUTATION_MODULE: ${{ matrix.module }}
          MUTATION_PROFILE: ${{ matrix.profile }}
          API_SHARD: ${{ matrix.shard }}
        run: |
          if [ "$API_SHARD" != none ]; then
            python3 -B scripts/ci/api_mutation.py verify-bytecode
            ./mvnw -B -ntp -P"$MUTATION_PROFILE" -pl "$MUTATION_MODULE" org.pitest:pitest-maven:mutationCoverage
            python3 -B scripts/ci/api_mutation.py manifest "$API_SHARD" api-service/target/pit-reports
          else
            ./mvnw -B -ntp -P"$MUTATION_PROFILE" -pl "$MUTATION_MODULE" -am test
          fi

      - name: Upload PIT reports
        if: always() && needs.mutation-scope.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pit-reports-${{ matrix.name }}
          path: ${{ matrix.module }}/target/pit-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Confirm mutation scope decision
        env:
          MUTATION_REQUIRED: ${{ needs.mutation-scope.outputs.required }}
        run: |
          case "$MUTATION_REQUIRED" in
            true) echo "Full mutation analysis was required." ;;
            false) echo "PIT omitted for documentation or static dashboard assets only." ;;
            *) echo "Invalid mutation scope result" >&2; exit 1 ;;
          esac

  api-mutation-complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [mutation-tests, mutation-scope]
    steps:
      - name: Checkout
        if: needs.mutation-scope.outputs.required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download API mutation reports
        if: needs.mutation-scope.outputs.required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pit-reports-api-*
          path: api-mutation-reports

      - name: Require the combined API mutation threshold
        if: needs.mutation-scope.outputs.required == 'true'
        run: python3 -B scripts/ci/api_mutation.py aggregate api-mutation-reports

      - name: Confirm mutation scope decision
        env:
          MUTATION_REQUIRED: ${{ needs.mutation-scope.outputs.required }}
        run: |
          case "$MUTATION_REQUIRED" in
            true) echo "Both API shards passed the combined mutation gate." ;;
            false) echo "PIT omitted for documentation or static dashboard assets only." ;;
            *) echo "Invalid mutation scope result" >&2; exit 1 ;;
          esac

  container-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 7
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        service: [routes-service, ingest-service, api-service]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build service image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  windows-backup-tests:
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Windows backup catch-up behavior
        shell: powershell
        run: .\operations\windows-backup\Test-Sync-ColoradoTrafficBackup.ps1

      - name: Verify local archive recovery behavior
        shell: powershell
        run: .\operations\windows-backup\Test-BackupLocalArchive.ps1

  ci-complete:
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [mutation-scope, build-and-test, resilience-tests, mutation-tests, api-mutation-complete, container-builds, windows-backup-tests]

    steps:
      - name: Require every CI job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          results = json.loads(os.environ["JOB_RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              print(f"CI did not pass: {failed}")
              sys.exit(1)
          print("All CI gates passed.")
          PYTHON
