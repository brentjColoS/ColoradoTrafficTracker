name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven

      - name: Verify with Maven
        run: ./mvnw -B clean verify

      - name: Verify resilience tooling
        run: ./scripts/verify-resilience.sh

  mutation-tests:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven

      - name: Run mutation testing profile
        run: ./mvnw -B -Pmutation -pl routes-service,ingest-service,api-service -am test

      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pit-reports
          path: |
            routes-service/target/pit-reports
            ingest-service/target/pit-reports
            api-service/target/pit-reports
          if-no-files-found: warn
