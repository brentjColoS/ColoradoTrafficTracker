name: Inspect cross-run dependency cache
on:
  pull_request:
    paths:
      - .github/workflows/cache-index-probe.yml
      - .github/actions/cache-index-probe/**
permissions:
  contents: read
jobs:
  cache-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-index-probe
