name: Verify fresh-runner dependency cache
on:
  pull_request:
    paths:
      - .github/workflows/cache-index-probe.yml
permissions:
  contents: read
jobs:
  cache-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure public registry cache
        run: |
          candidate=$(mktemp)
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json | jq -e -f scripts/ci/docker-registry-cache.jq > "$candidate"
          else
            printf '{}\n' | jq -e -f scripts/ci/docker-registry-cache.jq > "$candidate"
          fi
          sudo install -d /etc/docker
          sudo install -m 0600 "$candidate" /etc/docker/daemon.json
          rm "$candidate"
          sudo systemctl restart docker
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Restore routes dependencies without exporting a replacement
        id: routes
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: routes-service/Dockerfile
          target: dependencies
          push: false
          cache-from: type=gha,scope=routes-service-dependencies-v1,timeout=2m
      - name: Restore ingest dependencies without exporting a replacement
        id: ingest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ingest-service/Dockerfile
          target: dependencies
          push: false
          cache-from: type=gha,scope=ingest-service-dependencies-v1,timeout=2m
      - name: Restore API dependencies without exporting a replacement
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api-service/Dockerfile
          target: dependencies
          push: false
          cache-from: type=gha,scope=api-service-dependencies-v1,timeout=2m
      - name: Require all dependency RUN steps to be cached
        env:
          ROUTES_METADATA: ${{ steps.routes.outputs.metadata }}
          INGEST_METADATA: ${{ steps.ingest.outputs.metadata }}
          API_METADATA: ${{ steps.api.outputs.metadata }}
        run: |
          node <<'JS'
          const { spawnSync } = require('node:child_process');
          for (const [service, key] of [['routes-service', 'ROUTES_METADATA'], ['ingest-service', 'INGEST_METADATA'], ['api-service', 'API_METADATA']]) {
            const ref = JSON.parse(process.env[key])['buildx.build.ref'];
            if (!ref) throw new Error(`Missing build reference for ${service}`);
            const result = spawnSync('docker', ['buildx', 'history', 'logs', '--progress', 'rawjson', ref], { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 });
            if (result.status !== 0) throw new Error(`Cannot read build record for ${service}`);
            const vertices = new Map();
            for (const line of (result.stdout + '\n' + result.stderr).split('\n').filter(line => line.startsWith('{'))) {
              for (const vertex of JSON.parse(line).vertexes || []) {
                vertices.set(vertex.digest, { ...vertices.get(vertex.digest), ...vertex });
              }
            }
            const matches = [...vertices.values()].filter(vertex => vertex.name.includes(`-pl ${service} -am dependency:go-offline`));
            if (matches.length !== 1 || !matches[0].completed || matches[0].cached !== true) throw new Error(`${service} dependency RUN was not restored from cache`);
            console.log(`${service}: dependency RUN restored CACHED on a fresh runner`);
          }
          JS
