services:
  old-dashboard:
    image: ${OLD_DASHBOARD_IMAGE:?Use scripts/dashboard-sidecar.sh to select a committed image}
    environment:
      API_SECURITY_ENABLED: "true"
      API_SECURITY_KEYS: ${OLD_API_SECURITY_KEYS:?Set a separate old-dashboard API key}
      API_RATE_LIMIT_ENABLED: "true"
      API_RATE_LIMIT_REQUESTS_PER_MINUTE: ${OLD_API_RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      API_RATE_LIMIT_TRUST_FORWARDED_FOR: "true"
      DASHBOARD_PUBLIC_DATA_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: cloud
      SPRING_DATASOURCE_URL: jdbc:postgresql://${PRODUCTION_DB_HOST:-traffic-db}:5432/${PRODUCTION_POSTGRES_DB:-traffic}
      SPRING_DATASOURCE_USERNAME: ${OLD_DB_USERNAME:?Set the old-dashboard read-only database login}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?required}
      SPRING_DATASOURCE_HIKARI_READ_ONLY: "true"
      SPRING_FLYWAY_ENABLED: "false"
      OPERATIONAL_FLOW_STALE_AFTER_MINUTES: "60"
      OPERATIONAL_INCIDENT_STALE_AFTER_MINUTES: "60"
      OPERATIONAL_PROVIDER_STALE_AFTER_MINUTES: "60"
    ports:
      - "127.0.0.1:${OLD_DASHBOARD_PORT:-8084}:8080"
    networks:
      - production
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1536m
    cpus: 1.5
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  production:
    external: true
    name: ${PRODUCTION_DOCKER_NETWORK:-colorado-traffic-tracker_default}
